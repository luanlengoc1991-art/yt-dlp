<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Đăng nhập · yt-dlp Studio</title>
<style>
  :root { --bg:#0a0b10; --panel:#12141c; --line:#2f3447; --text:#eef0f6; --muted:#8b90a5; --grad:linear-gradient(135deg,#ff4d6a,#ff8a4c); }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(600px 360px at 50% -10%, rgba(255,77,106,.18), transparent 70%); }
  form { position:relative; width:100%; max-width:380px; background:var(--panel); border:1px solid #242838; border-radius:20px; padding:32px 28px; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .logo { width:48px; height:48px; border-radius:14px; background:var(--grad); display:grid; place-items:center; margin-bottom:18px; box-shadow:0 10px 26px rgba(255,77,106,.35); }
  .logo svg { width:22px; height:22px; }
  h1 { font-size:22px; margin:0 0 6px; letter-spacing:-.01em; }
  p { color:var(--muted); margin:0 0 22px; font-size:14px; }
  input { width:100%; height:48px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); padding:0 14px; font:inherit; font-size:16px; outline:0; }
  input:focus { border-color:rgba(255,77,106,.6); box-shadow:0 0 0 4px rgba(255,77,106,.12); }
  button { width:100%; height:48px; margin-top:14px; border:0; border-radius:12px; background:var(--grad); color:#fff; font:inherit; font-weight:700; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:#ff9aa5; font-size:14px; min-height:20px; margin-top:12px; }
  .get { display:grid; gap:10px; text-align:center; margin-top:12px; padding-top:18px; border-top:1px solid #242838; color:var(--muted); font-size:13px; }
  .getbtn { display:flex; align-items:center; justify-content:center; gap:8px; height:46px; border-radius:12px; border:1px solid var(--line);
    background:#181b26; color:var(--text); font-weight:700; font-size:15px; text-decoration:none; }
  .getbtn:hover { background:#20243a; }
  .getbtn svg { width:18px; height:18px; }
  .more { color:var(--muted); font-size:13px; }
  .more:hover { color:var(--text); }
</style>
</head>
<body>
<form id="f">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></div>
  <h1>yt-dlp Studio</h1>
  <p>Nhập mật khẩu để dùng app từ xa.</p>
  <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password" autofocus required>
  <button id="btn">Đăng nhập</button>
  <div class="err" id="err"></div>
  <div class="get">
    <span>Chưa có app trên máy tính?</span>
    <a class="getbtn" href="/yt-dlp-studio.exe" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      Tải app cho Windows
    </a>
    <a class="more" href="/tai-app">Xem giới thiệu & hướng dẫn cài</a>
  </div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Studio': '1' },
      body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (r.ok) { location.reload(); return; }
    err.textContent = (await r.json().catch(() => ({}))).error || 'Đăng nhập không được';
  } catch { err.textContent = 'Không kết nối được tới máy tính'; }
  btn.disabled = false;
};
</script>
</body>
</html>
