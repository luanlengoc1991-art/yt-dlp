<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Đăng nhập · yt-dlp Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070a08; --panel:#0d130f; --line:#2b3b2f; --text:#eef3ef; --muted:#94a89a; --accent:#0ac86e; --lime:#7ee85c; --ink:#04120a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(700px 400px at 50% -10%, rgba(10,200,110,.16), transparent 70%); }
  form { position:relative; width:100%; max-width:390px; background:rgba(13,19,15,.85); border:1px solid #1c271f; border-radius:22px; backdrop-filter:blur(10px); padding:32px 28px; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .logo { width:48px; height:48px; border-radius:14px; background:var(--accent); display:grid; place-items:center; margin-bottom:18px; box-shadow:0 0 0 1px rgba(126,232,92,.35), 0 10px 30px rgba(10,200,110,.35); }
  .logo svg { stroke:var(--ink); }
  .logo svg { width:22px; height:22px; }
  h1 { font-family:"Bricolage Grotesque","Be Vietnam Pro",sans-serif; font-size:28px; font-weight:800; margin:0 0 6px; letter-spacing:-.03em; }
  h1 em { font-style:normal; color:var(--lime); }
  p { color:var(--muted); margin:0 0 22px; font-size:14px; }
  input { width:100%; height:48px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); padding:0 14px; font:inherit; font-size:16px; outline:0; }
  input:focus { border-color:rgba(126,232,92,.55); box-shadow:0 0 0 4px rgba(10,200,110,.12); }
  button { width:100%; height:48px; margin-top:14px; border:0; border-radius:12px; background:var(--accent); color:var(--ink); box-shadow:0 10px 30px rgba(10,200,110,.3); font:inherit; font-weight:700; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:#ff9aa5; font-size:14px; min-height:20px; margin-top:12px; }
  .get { display:grid; gap:10px; text-align:center; margin-top:12px; padding-top:18px; border-top:1px solid #1c271f; color:var(--muted); font-size:13px; }
  .getbtn { display:flex; align-items:center; justify-content:center; gap:8px; height:46px; border-radius:12px; border:1px solid var(--line);
    background:#121a14; color:var(--text); font-weight:700; font-size:15px; text-decoration:none; }
  .getbtn:hover { background:#18221a; border-color:#3a4d3e; }
  .getbtn svg { width:18px; height:18px; }
  .more { color:var(--muted); font-size:13px; }
  .more:hover { color:var(--text); }
</style>
</head>
<body>
<form id="f">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></div>
  <h1>yt-dlp <em>Studio</em></h1>
  <p>Nhập mật khẩu để dùng app từ xa.</p>
  <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password" autofocus required>
  <button id="btn">Đăng nhập</button>
  <div class="err" id="err"></div>
  <div class="get">
    <span>Chưa có app trên máy tính?</span>
    <a class="getbtn" href="/yt-dlp-studio.exe" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      Tải app cho Windows
    </a>
    <a class="more" href="/tai-app">Xem giới thiệu & hướng dẫn cài</a>
  </div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Studio': '1' },
      body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (r.ok) { location.reload(); return; }
    err.textContent = (await r.json().catch(() => ({}))).error || 'Đăng nhập không được';
  } catch { err.textContent = 'Không kết nối được tới máy tính'; }
  btn.disabled = false;
};
</script>
</body>
</html>
