name = "ytdlp-studio"
main = "src/index.js"
compatibility_date = "2026-10-01"
# ytdlp.luangroup.asia trỏ về app trên máy nhà qua Cloudflare Tunnel.
# Riêng 2 đường dẫn dưới đây do Worker phục vụ để các máy khác vẫn cập nhật được khi máy nhà tắt.
routes = [
  { pattern = "ytdlp.luangroup.asia/latest.json*", zone_name = "luangroup.asia" },
  { pattern = "ytdlp.luangroup.asia/yt-dlp-studio.exe*", zone_name = "luangroup.asia" },
  # Trang giới thiệu + nút tải app (luôn mở được, kể cả khi máy nhà tắt)
  { pattern = "ytdlp.luangroup.asia/tai-app*", zone_name = "luangroup.asia" },
]

[assets]
directory = "./public"
