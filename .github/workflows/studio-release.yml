# Moi lan push thay doi app len nhanh studio: build yt-dlp-studio.exe -> tao GitHub Release.
# Worker ytdlp.luangroup.asia/latest.json doc Release moi nhat, nen cac may dang dung app tu cap nhat.
name: Studio Release

on:
  push:
    branches: [studio]
    paths:
      - gui/**
      - yt_dlp/**
      - devscripts/**
      - pyproject.toml
      - .github/workflows/studio-release.yml
  workflow_dispatch:
    inputs:
      notes:
        description: Ghi chu phien ban (de trong = lay tu cac commit)
        required: false

concurrency:
  group: studio-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: So phien ban
        id: ver
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          $vf = 'gui/studio_version.py'
          $src = Get-Content $vf -Raw
          $base = [version][regex]::Match($src, "STUDIO_VERSION = '([\d.]+)'").Groups[1].Value
          $last = git tag -l 'studio-v*' | ForEach-Object { [version]($_ -replace '^studio-v') } | Sort-Object -Descending | Select-Object -First 1
          # So trong file cao hon ban da phat hanh thi dung no (doi so lon), khong thi tu tang so cuoi
          $v = if ($last -and $base -le $last) { "$($last.Major).$($last.Minor).$($last.Build + 1)" } else { "$base" }
          Set-Content $vf ($src -replace "STUDIO_VERSION = '[\d.]+'", "STUDIO_VERSION = '$v'") -NoNewline -Encoding utf8NoBOM
          $notes = $env:NOTES
          if (-not $notes -and $last) {
            $notes = (git log --no-merges --format='%s' "studio-v$last..HEAD" -- gui yt_dlp | Select-Object -First 8) -join '; '
          }
          if (-not $notes) { $notes = "Phien ban $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Set-Content notes.txt $notes -Encoding utf8NoBOM
          "Phat hanh $v - $notes"

      - name: Cai thu vien
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[default]" pyinstaller==6.22.0

      - name: Build exe
        run: |
          python devscripts/make_lazy_extractors.py
          python -m PyInstaller --noconfirm --onefile --windowed --log-level WARN --name yt-dlp-studio `
            --icon "$PWD\devscripts\logo.ico" `
            --additional-hooks-dir="$PWD\yt_dlp\__pyinstaller" `
            --add-data "$PWD\gui\index.html:gui" --add-data "$PWD\gui\login.html:gui" `
            --exclude-module setuptools --distpath dist --workpath build/studio --specpath build/studio gui/server.py
          if (-not (Test-Path dist/yt-dlp-studio.exe) -or (Get-Item dist/yt-dlp-studio.exe).Length -lt 5MB) { throw 'Build exe that bai' }

      - name: Tao Release
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $exe = Get-Item dist/yt-dlp-studio.exe
          $manifest = [ordered]@{
            version = $v
            url     = "https://github.com/${{ github.repository }}/releases/download/studio-v$v/yt-dlp-studio.exe"
            sha256  = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            size    = $exe.Length
            notes   = (Get-Content notes.txt -Raw).Trim()
            date    = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $manifest | ConvertTo-Json | Set-Content dist/latest.json -Encoding utf8NoBOM
          gh release create "studio-v$v" dist/yt-dlp-studio.exe dist/latest.json --target $env:GITHUB_SHA `
            --title "yt-dlp Studio $v" --notes-file notes.txt --latest
          if ($LASTEXITCODE) { throw 'Tao Release that bai' }
